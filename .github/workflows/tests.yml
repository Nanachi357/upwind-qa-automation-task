name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      TEST_IMAGE: qa-automation-tests
      TEST_CONTAINER: qa-automation-tests-run
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build test image
        run: |
          docker build --tag "$TEST_IMAGE" .

      - name: Run tests
        run: |
          docker run --name "$TEST_CONTAINER" "$TEST_IMAGE"

      - name: Collect test reports
        if: always()
        run: |
          mkdir -p build/ci-artifacts
          if docker container inspect "$TEST_CONTAINER" > /dev/null 2>&1; then
            docker logs "$TEST_CONTAINER" > build/ci-artifacts/container.log 2>&1
            for directory in reports test-results; do
              docker cp "$TEST_CONTAINER:/app/build/$directory" "build/ci-artifacts/$directory" ||
                echo "::warning::No $directory were generated by the container"
            done
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-automation-reports
          path: build/ci-artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Remove test container
        if: always()
        run: |
          docker rm --force "$TEST_CONTAINER" 2>/dev/null || true
